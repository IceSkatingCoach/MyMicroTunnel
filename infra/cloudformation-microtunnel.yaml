  # An NLB cannot redirect, so there is no port 80 listener. Plain HTTP to this
  # hostname simply does not answer, which is the safer of the two options for
  # a server that hands out signed update manifests.

  # The alias record for ServiceDomainName is not here; see the top of the
  # file. The installer upserts it, because CloudFormation cannot.

  # --- Telling somebody ----------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: Alarms
    Properties:
      DisplayName: !Sub '${AWS::StackName} gateway'

  # Separate resources rather than an inline Subscription list, because that
  # list cannot be built conditionally: a template with one of the two set would
  # otherwise carry an empty endpoint and fail to deploy.
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Endpoint: !Ref AlarmEmail
      Protocol: email

  WebhookSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmWebhook
    Properties:
      TopicArn: !Ref AlarmTopic
      Endpoint: !Ref AlarmWebhook
      Protocol: https

  # The gateway is the one part that should never be down on purpose — unless
  # idle-stop is on, in which case see GatewayShortAlarm below.
  GatewayDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsGatewayDown
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gateway-down'
      AlarmDescription: >-
        No gateway instance is in service, so the hostname is dark and the
        Auto Scaling group has not managed to replace it.
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref GatewayGroup
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # The same question asked of a deployment that switches itself off: not "is
  # an instance running" but "is one missing that was asked for".
  GatewayShortAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsGatewayShort
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gateway-down'
      AlarmDescription: >-
        Fewer gateway instances in service than were asked for: the hostname
        is dark and the replacement has not worked.
      Metrics:
        - Id: shortfall
          Expression: desired - inservice
          Label: Gateway instances asked for but not in service
          ReturnData: true
        - Id: desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/AutoScaling
              MetricName: GroupDesiredCapacity
              Dimensions:
                - Name: AutoScalingGroupName
                  Value: !Ref GatewayGroup
            Period: 300
            Stat: Maximum
        - Id: inservice
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/AutoScaling
              MetricName: GroupInServiceInstances
              Dimensions:
                - Name: AutoScalingGroupName
                  Value: !Ref GatewayGroup
            Period: 300
            Stat: Minimum
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Not breaching: an ASG at zero publishes nothing, and that is the state
      # this deployment is designed to spend most of its time in.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  TunnelDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsTunnel
    Properties:
      AlarmName: !Sub '${AWS::StackName}-no-workstation-connected'
      AlarmDescription: >-
        No workstation has completed a WireGuard handshake recently, so the
        hostname answers TLS and then nothing.
      Namespace: MyMicroTunnel
      MetricName: ConnectedPeers
      Dimensions:
        - Name: StackName
          Value: !Ref AWS::StackName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

Outputs:
  ServiceUrl:
    Description: Public base URL for the on-premises deployment
    Value: !Sub 'https://${ServiceDomainName}'

  HealthCheckUrl:
    Value: !Sub 'https://${ServiceDomainName}${HealthCheckPath}'

  GatewayPublicIp:
    Description: WireGuard Endpoint for each workstation's wg0.conf
    Value: !Ref GatewayEip

  TargetGroupArn:
    Description: Target group the installer registers each workstation in
    Value: !Ref TargetGroup

  # One exposed port and its target group, as port=arn. Pairs rather than two
  # outputs each, because a slot holding no port has no target group at all and
  # the installer cannot register into a name it had to guess.
  TcpTarget1:
    Condition: HasTcpPort1
    Value: !Join ['=', [!Ref TcpPort1, !Ref TcpTargetGroup1]]

  TcpTarget2:
    Condition: HasTcpPort2
    Value: !Join ['=', [!Ref TcpPort2, !Ref TcpTargetGroup2]]

  TcpTarget3:
    Condition: HasTcpPort3
    Value: !Join ['=', [!Ref TcpPort3, !Ref TcpTargetGroup3]]

  TcpTarget4:
    Condition: HasTcpPort4
    Value: !Join ['=', [!Ref TcpPort4, !Ref TcpTargetGroup4]]

  TcpTarget5:
    Condition: HasTcpPort5
    Value: !Join ['=', [!Ref TcpPort5, !Ref TcpTargetGroup5]]

  TcpTarget6:
    Condition: HasTcpPort6
    Value: !Join ['=', [!Ref TcpPort6, !Ref TcpTargetGroup6]]

  TcpTarget7:
    Condition: HasTcpPort7
    Value: !Join ['=', [!Ref TcpPort7, !Ref TcpTargetGroup7]]

  TcpTarget8:
    Condition: HasTcpPort8
    Value: !Join ['=', [!Ref TcpPort8, !Ref TcpTargetGroup8]]

  TcpTarget9:
    Condition: HasTcpPort9
    Value: !Join ['=', [!Ref TcpPort9, !Ref TcpTargetGroup9]]

  TcpTarget10:
    Condition: HasTcpPort10
    Value: !Join ['=', [!Ref TcpPort10, !Ref TcpTargetGroup10]]

  PeersParameter:
    Description: SSM parameter holding the WireGuard peer list
    Value: !Sub '/${AWS::StackName}/wireguard/peers'

  ServerPublicKeyParameter:
    Description: SSM parameter the gateway publishes its public key to
    Value: !Sub '/${AWS::StackName}/wireguard/server-public-key'

  GatewayGroupName:
    Value: !Ref GatewayGroup

  WakeRoleArn:
    Description: >-
      Role the workstation assumes to bring the gateway back after an idle
      stop. Nothing else in the deployment uses it.
    Value: !GetAtt WakeRole.Arn

  IdleTimeoutMinutes:
    Description: Minutes of silence before the gateway scales to zero; 0 is never
    Value: !Ref IdleTimeoutMinutes

  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName

  # Both halves of the alias the installer writes. The zone id is the load
  # balancer's own, not the customer's — an alias record names the zone of the
  # thing it points at.
  LoadBalancerHostedZoneId:
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID

  AlarmTopicArn:
    Condition: Alarms
    Value: !Ref AlarmTopic
