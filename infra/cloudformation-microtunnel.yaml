AWSTemplateFormatVersion: '2010-09-09'

# Network Load Balancer in AWS fronting a service that runs on a workstation
# outside AWS, reached over a WireGuard tunnel.
#
# WHY NOT AWS Site-to-Site VPN
# ----------------------------
# An AWS::EC2::CustomerGateway needs a fixed public IP address, because AWS is
# the side that answers the IKE negotiation. The workstation sits behind a
# residential NAT with a dynamic address, so that address is not usable as a
# customer gateway. AWS does support a certificate-based customer gateway with
# no IpAddress for exactly this case, but it requires an ACM Private CA at
# roughly USD 400/month, which dwarfs everything else in this stack.
#
# WireGuard inverts the direction: the workstation dials out to a fixed Elastic
# IP, so no inbound port forward is needed on the home router and a new ISP
# lease just re-pins the tunnel on the next keepalive.
#
# TRAFFIC PATH
# ------------
#   client -> NLB :443 (TLS terminated here)
#          -> target 10.100.0.2:3000, an address outside the VPC CIDR
#          -> VPC route 10.100.0.0/24 -> gateway instance ENI
#          -> wg0 -> workstation -> the service listens on :3000
#
# The gateway does no NAT. Replies leave the workstation with source
# 10.100.0.2 and are routed back through the same instance, which is why the
# instance has SourceDestCheck disabled.
#
# WHAT THIS TEMPLATE DOES NOT OWN
# -------------------------------
# Two things that used to be CloudFormation properties are now reconciled at
# run time, because both of them change far more often than the stack does:
#
#   · the peer list, in SSM at PeersParameter. Adding a workstation used to
#     mean a new ClientPublicKey, a rewritten boot script, and therefore a
#     replaced instance. A timer on the gateway now reads that parameter and
#     applies it with `wg set`, so a peer change costs one API call.
#
#   · the target group's targets, registered by the installer. CloudFormation
#     would otherwise have to know every workstation address at deploy time.
#
# Both are deliberate gaps in the stack's coverage: `cloudformation delete`
# leaves neither behind, because the parameter is owned by the stack and the
# targets die with the target group.
#
# WHY THE GATEWAY IS AN AUTO SCALING GROUP OF ONE
# -----------------------------------------------
# A bare instance that fails stays failed until a human notices. A group of one
# is replaced automatically. Two things follow from that, and both are handled
# in UserData rather than here, because neither the replacement instance nor
# its ENI has an id CloudFormation can refer to:
#
#   · the Elastic IP is associated by the instance itself, so the endpoint in
#     every workstation's wg0.conf keeps pointing at a live gateway;
#   · the VPN route is (re)written by the instance itself, at every boot.
#
# The server keypair is persisted in SSM as a SecureString and read back by the
# replacement, so a replaced gateway keeps its WireGuard identity. Without that,
# every replacement would silently invalidate the PublicKey line in each
# workstation's config.

Parameters:
  ServiceDomainName:
    Type: String
    Description: >-
      Public hostname served by this NLB, for example
      updates.example.com. A certificate is issued for it and a Route53 alias
      record is created in HostedZoneId.
    AllowedPattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)+$'
    ConstraintDescription: must be a fully qualified domain name

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      Public hosted zone that is authoritative for ServiceDomainName. The
      installer finds it by walking up from the hostname; it is a parameter
      rather than an Fn::ImportValue so this stack does not require a
      particular DNS stack to exist alongside it.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the load balancer and the gateway live in

  VpcCidr:
    Type: String
    Description: >-
      Source range allowed to reach the tunnelled port, i.e. the NLB nodes.
      This is the CIDR of VpcId.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets, one per availability zone, for the NLB nodes

  GatewaySubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Public subnets the gateway may be placed in. More than one lets the Auto
      Scaling group rebuild the gateway when an entire availability zone is
      unavailable; the tunnel is still a single instance at any moment.

  RouteTableIds:
    Type: CommaDelimitedList
    Description: >-
      Every route table whose subnets must reach the tunnel. The gateway writes
      the VpnCidr route into each of them at boot. A default VPC has one main
      route table; a VPC with per-subnet tables needs each of them listed.

  VpnCidr:
    Type: String
    Default: 10.100.0.0/24
    Description: Tunnel subnet. Must not overlap the VPC or any workstation LAN.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'

  GatewayVpnAddress:
    Type: String
    Default: 10.100.0.1
    Description: Tunnel address of the gateway instance
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'

  ServicePort:
    Type: Number
    Default: 3000
    MinValue: 1
    MaxValue: 65535
    Description: Port the service listens on, on every workstation

  HealthCheckPath:
    Type: String
    Default: /hc
    Description: Path the load balancer polls to decide a workstation is serving

  GatewayInstanceType:
    Type: String
    Default: t4g.micro
    Description: >-
      Not t4g.nano. Its 512 MB is not enough for `dnf install` to parse the
      AL2023 repository metadata: the first attempt at this stack died with
      "Killed" on that line, leaving no /etc/wireguard at all. The swap file in
      UserData is a second guard against the same failure.

  GatewayImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64
    Description: >-
      Latest AL2023 arm64 AMI. Kernel 6.1 carries WireGuard in-tree, so only
      the userspace tooling is installed at boot.

  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Address to notify when the gateway is unhealthy. Empty means no topic and
      no alarms are created: a stack with nobody to tell should not pay for the
      machinery of telling them.

  AlarmWebhook:
    Type: String
    Default: ''
    Description: >-
      HTTPS endpoint to POST alarms to, as well as or instead of the email —
      a Slack incoming webhook, a PagerDuty events URL, anything that accepts
      SNS notifications. Email is fine for one deployment and unreadable across
      twenty.

  AlarmOnTunnelDown:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Also alarm when no workstation is serving. Off by default because the
      tunnel is a switch someone turns off on purpose, and an alarm that fires
      every evening is an alarm nobody reads.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasAlarmWebhook: !Not [!Equals [!Ref AlarmWebhook, '']]
  # Either destination is reason enough to build the topic and the alarms.
  Alarms: !Or [!Condition HasAlarmEmail, !Condition HasAlarmWebhook]
  AlarmsTunnel: !And
    - !Condition Alarms
    - !Equals [!Ref AlarmOnTunnelDown, 'true']

Resources:
  # --- Tunnel gateway ------------------------------------------------------
  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'WireGuard gateway for ${AWS::StackName}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Open to the internet on purpose: a workstation's source address
        # changes, so it cannot be pinned here. Authentication is the
        # WireGuard key exchange, and an unauthenticated packet is dropped
        # without a reply.
        - IpProtocol: udp
          FromPort: 51820
          ToPort: 51820
          CidrIp: 0.0.0.0/0
          Description: WireGuard from the workstations
        # Forwarded traffic crosses this ENI, so the security group has to
        # admit the NLB's health checks and requests as well.
        - IpProtocol: tcp
          FromPort: !Ref ServicePort
          ToPort: !Ref ServicePort
          CidrIp: !Ref VpcCidr
          Description: NLB nodes towards the tunnelled service

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager, so the instance needs no SSH key and no port 22.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: gateway-self-configuration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The keypair and the peer list. Scoped to this stack's own
              # parameter prefix, so one account can hold several deployments
              # without either of them being able to read the other's key.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/wireguard/*'
              # Claiming the Elastic IP and repointing the route are what make
              # a replacement instance a working gateway rather than a new one
              # nobody can reach. Neither API accepts a resource ARN.
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DescribeAddresses
                  - ec2:DescribeRouteTables
                  - ec2:CreateRoute
                  - ec2:ReplaceRoute
                  - ec2:ModifyInstanceAttribute
                Resource: '*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: XpremVpn

  GatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref GatewayRole

  GatewayEip:
    Type: AWS::EC2::EIP
    # Not associated here. The instance claims it at boot, because a replacement
    # instance has no id this template can name.
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-wireguard-endpoint'

  GatewayLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref GatewayImageId
        InstanceType: !Ref GatewayInstanceType
        IamInstanceProfile:
          Arn: !GetAtt GatewayInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref GatewaySecurityGroup
        MetadataOptions:
          # IMDSv2 only, and a hop limit of 1 so a container on the instance
          # cannot reach the credentials the role hands out.
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-wireguard-gateway'
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail

              # dnf's metadata parse is the memory high-water mark of this boot.
              if [ ! -f /swapfile ]; then
                dd if=/dev/zero of=/swapfile bs=1M count=1024
                chmod 600 /swapfile
                mkswap /swapfile
                swapon /swapfile
                echo '/swapfile none swap sw 0 0' >> /etc/fstab
              fi

              dnf -y install wireguard-tools aws-cfn-bootstrap
              trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource GatewayGroup --region ${AWS::Region} || true' ERR

              # Sourced by the reconcile script, so the two never disagree about
              # which parameters and which route tables belong to this stack.
              cat > /etc/xprem-gateway.env <<ENV
              REGION=${AWS::Region}
              STACK=${AWS::StackName}
              PEERS_PARAM=/${AWS::StackName}/wireguard/peers
              SERVER_PUBLIC_PARAM=/${AWS::StackName}/wireguard/server-public-key
              SERVER_PRIVATE_PARAM=/${AWS::StackName}/wireguard/server-private-key
              ALLOCATION_ID=${AllocationId}
              ROUTE_TABLES="${RouteTables}"
              VPN_CIDR=${VpnCidr}
              GATEWAY_ADDRESS=${GatewayVpnAddress}
              ENV
              chmod 600 /etc/xprem-gateway.env
              . /etc/xprem-gateway.env

              TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token \
                -H 'X-aws-ec2-metadata-token-ttl-seconds: 600')
              INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/instance-id)
              echo "INSTANCE_ID=$INSTANCE_ID" >> /etc/xprem-gateway.env

              # The endpoint every workstation dials. Claimed before anything
              # else, so a replacement is reachable as early as possible.
              aws ec2 associate-address --region "$REGION" \
                --instance-id "$INSTANCE_ID" \
                --allocation-id "$ALLOCATION_ID" \
                --allow-reassociation

              # Required: this instance both sends and receives packets
              # addressed to the tunnel subnet, which is not one of its own
              # addresses. A launch template has no field for it, so it is set
              # here rather than as a property of the instance.
              aws ec2 modify-instance-attribute --region "$REGION" \
                --instance-id "$INSTANCE_ID" --no-source-dest-check

              echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/99-wireguard.conf
              sysctl --system

              mkdir -p /etc/wireguard
              chmod 700 /etc/wireguard
              umask 077

              # Read back rather than regenerated, so a replacement keeps the
              # identity every workstation's [Peer] PublicKey line names. A new
              # keypair here would look like a working deploy and leave every
              # tunnel unable to handshake.
              if aws ssm get-parameter --region "$REGION" --with-decryption \
                   --name "$SERVER_PRIVATE_PARAM" --query Parameter.Value \
                   --output text > /etc/wireguard/server.key 2>/dev/null \
                 && [ -s /etc/wireguard/server.key ]; then
                echo 'reusing the stored server key'
              else
                wg genkey > /etc/wireguard/server.key
                aws ssm put-parameter --region "$REGION" \
                  --name "$SERVER_PRIVATE_PARAM" --type SecureString --overwrite \
                  --value "$(cat /etc/wireguard/server.key)"
              fi
              wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub

              cat > /etc/wireguard/wg0.conf <<CONF
              [Interface]
              Address = $GATEWAY_ADDRESS/24
              ListenPort = 51820
              PrivateKey = $(cat /etc/wireguard/server.key)
              CONF
              # Peers are deliberately absent: they arrive from SSM below, and
              # keeping them out of this file means a peer change never needs a
              # new boot script and therefore never replaces this instance.

              install -m 0755 /dev/stdin /usr/local/sbin/xprem-gateway-sync <<'SYNC'
              #!/bin/bash
              # Reconciles the three things that are not CloudFormation's to own:
              # the VPN route, the WireGuard peer list, and the metric that says
              # whether anybody is actually connected.
              set -euo pipefail
              . /etc/xprem-gateway.env

              for table in $ROUTE_TABLES; do
                aws ec2 replace-route --region "$REGION" \
                  --route-table-id "$table" \
                  --destination-cidr-block "$VPN_CIDR" \
                  --instance-id "$INSTANCE_ID" 2>/dev/null \
                || aws ec2 create-route --region "$REGION" \
                  --route-table-id "$table" \
                  --destination-cidr-block "$VPN_CIDR" \
                  --instance-id "$INSTANCE_ID" >/dev/null
              done

              peers=$(aws ssm get-parameter --region "$REGION" --name "$PEERS_PARAM" \
                --query Parameter.Value --output text 2>/dev/null || echo '[]')

              # python3 rather than jq: it is already on an AL2023 image, and a
              # malformed parameter should leave the running peers alone rather
              # than take the tunnel down.
              desired=$(printf '%s' "$peers" | python3 -c '
              import json, sys
              try:
                  entries = json.load(sys.stdin)
              except Exception:
                  sys.exit(3)
              for entry in entries:
                  key = str(entry.get("publicKey", "")).strip()
                  address = str(entry.get("address", "")).strip()
                  if key and address:
                      print(key, address)
              ') || { echo "peer parameter is not valid JSON; leaving peers unchanged" >&2; desired=""; unchanged=1; }

              if [ -z "${!unchanged:-}" ]; then
                for key in $(wg show wg0 peers 2>/dev/null || true); do
                  printf '%s\n' "$desired" | grep -q "^$key " || wg set wg0 peer "$key" remove
                done
                while read -r key address; do
                  [ -n "$key" ] || continue
                  wg set wg0 peer "$key" allowed-ips "$address/32"
                done <<< "$desired"
                # Persisted so a reboot comes back with the peers it had, without
                # waiting for the next timer tick.
                wg-quick save wg0 2>/dev/null || true
              fi

              # A handshake inside three minutes is the definition of connected:
              # PersistentKeepalive is 25s, so anything older means gone.
              now=$(date +%s)
              connected=0
              while read -r _ stamp; do
                [ -n "$stamp" ] || continue
                [ "$stamp" -gt 0 ] || continue
                [ $((now - stamp)) -lt 180 ] && connected=$((connected + 1))
              done < <(wg show wg0 latest-handshakes 2>/dev/null || true)

              aws cloudwatch put-metric-data --region "$REGION" \
                --namespace XpremVpn \
                --metric-name ConnectedPeers \
                --dimensions StackName="$STACK" \
                --value "$connected" >/dev/null 2>&1 || true
              SYNC

              cat > /etc/systemd/system/xprem-gateway-sync.service <<UNIT
              [Unit]
              Description=Reconcile the WireGuard peers, the VPN route and the connected-peer metric
              After=wg-quick@wg0.service
              Wants=wg-quick@wg0.service

              [Service]
              Type=oneshot
              ExecStart=/usr/local/sbin/xprem-gateway-sync
              UNIT

              cat > /etc/systemd/system/xprem-gateway-sync.timer <<UNIT
              [Unit]
              Description=Run the gateway reconcile every minute

              [Timer]
              OnBootSec=30s
              OnUnitActiveSec=60s
              AccuracySec=5s

              [Install]
              WantedBy=timers.target
              UNIT

              systemctl enable --now wg-quick@wg0
              systemctl daemon-reload
              systemctl enable --now xprem-gateway-sync.timer
              # Once synchronously, so the route and the peers exist before the
              # signal below tells CloudFormation the gateway is ready.
              /usr/local/sbin/xprem-gateway-sync

              # Published last: its arrival is the installer's signal that the
              # boot script got all the way through.
              aws ssm put-parameter --region "$REGION" \
                --name "$SERVER_PUBLIC_PARAM" --type String --overwrite \
                --value "$(cat /etc/wireguard/server.pub)"

              /opt/aws/bin/cfn-signal -e 0 \
                --stack ${AWS::StackName} \
                --resource GatewayGroup \
                --region ${AWS::Region}
            - AllocationId: !GetAtt GatewayEip.AllocationId
              RouteTables: !Join [' ', !Ref RouteTableIds]

  GatewayGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    # Without this, a UserData that dies halfway still reports CREATE_COMPLETE
    # and the breakage only surfaces later as a tunnel that never comes up.
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
        Count: 1
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        WaitOnResourceSignals: true
        PauseTime: PT10M
    Properties:
      MinSize: '1'
      MaxSize: '1'
      DesiredCapacity: '1'
      VPCZoneIdentifier: !Ref GatewaySubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref GatewayLaunchTemplate
        Version: !GetAtt GatewayLaunchTemplate.LatestVersionNumber
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      # Collected so the group-size alarm below has something to read.
      MetricsCollection:
        - Granularity: 1Minute
          Metrics:
            - GroupInServiceInstances

  # --- TLS -----------------------------------------------------------------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ServiceDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ServiceDomainName
          HostedZoneId: !Ref HostedZoneId

  # --- Load balancer -------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: network
      Subnets: !Ref SubnetIds
      LoadBalancerAttributes:
        # Mandatory here, not a tuning choice: a target registered with
        # AvailabilityZone "all" is only reachable from every NLB node when
        # cross-zone load balancing is on.
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: TCP
      Port: !Ref ServicePort
      # Targets are registered by the installer, one per workstation, because
      # this template cannot know how many there will be. "all" is what marks a
      # target as living outside the VPC, reached over routing.
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '10'

  TlsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: TLS
      Certificates:
        - CertificateArn: !Ref Certificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # An NLB cannot redirect, so there is no port 80 listener. Plain HTTP to this
  # hostname simply does not answer, which is the safer of the two options for
  # a server that hands out signed update manifests.

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${ServiceDomainName}.'
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  # --- Telling somebody ----------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: Alarms
    Properties:
      DisplayName: !Sub '${AWS::StackName} gateway'

  # Separate resources rather than an inline Subscription list, because that
  # list cannot be built conditionally: a template with one of the two set would
  # otherwise carry an empty endpoint and fail to deploy.
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Endpoint: !Ref AlarmEmail
      Protocol: email

  WebhookSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmWebhook
    Properties:
      TopicArn: !Ref AlarmTopic
      Endpoint: !Ref AlarmWebhook
      Protocol: https

  # The gateway is the one part that should never be down on purpose.
  GatewayDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Alarms
    Properties:
      AlarmName: !Sub '${AWS::StackName}-gateway-down'
      AlarmDescription: >-
        No gateway instance is in service, so the hostname is dark and the
        Auto Scaling group has not managed to replace it.
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref GatewayGroup
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  TunnelDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsTunnel
    Properties:
      AlarmName: !Sub '${AWS::StackName}-no-workstation-connected'
      AlarmDescription: >-
        No workstation has completed a WireGuard handshake recently, so the
        hostname answers TLS and then nothing.
      Namespace: XpremVpn
      MetricName: ConnectedPeers
      Dimensions:
        - Name: StackName
          Value: !Ref AWS::StackName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

Outputs:
  ServiceUrl:
    Description: Public base URL for the on-premises deployment
    Value: !Sub 'https://${ServiceDomainName}'

  HealthCheckUrl:
    Value: !Sub 'https://${ServiceDomainName}${HealthCheckPath}'

  GatewayPublicIp:
    Description: WireGuard Endpoint for each workstation's wg0.conf
    Value: !Ref GatewayEip

  TargetGroupArn:
    Description: Target group the installer registers each workstation in
    Value: !Ref TargetGroup

  PeersParameter:
    Description: SSM parameter holding the WireGuard peer list
    Value: !Sub '/${AWS::StackName}/wireguard/peers'

  ServerPublicKeyParameter:
    Description: SSM parameter the gateway publishes its public key to
    Value: !Sub '/${AWS::StackName}/wireguard/server-public-key'

  GatewayGroupName:
    Value: !Ref GatewayGroup

  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName

  AlarmTopicArn:
    Condition: Alarms
    Value: !Ref AlarmTopic
