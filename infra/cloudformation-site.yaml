AWSTemplateFormatVersion: '2010-09-09'

# The product website: a private S3 bucket published through one CloudFront
# distribution.
#
# WHOSE ACCOUNT THIS IS
# ---------------------
# The vendor's, like cloudformation-updates.yaml and unlike the customer stack.
# Kept separate from the update feed on purpose: a marketing page is edited
# often and by whoever is writing it, while the feed is the one file that, if it
# is wrong, reaches through to every installed copy. They should not share a
# bucket, a cache policy, or a blast radius.
#
# DEPLOY THIS IN us-east-1
# ------------------------
# CloudFront only reads ACM certificates from us-east-1.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique name for the bucket holding the site
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: must be a valid S3 bucket name

  LaunchBucketName:
    Type: String
    Description: >-
      Globally unique name for the small bucket holding the one-click
      CloudFormation template. Separate from the site bucket because its name
      is visible to everyone who reads the install link, and a bucket cannot
      be renamed afterwards.
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: must be a valid S3 bucket name

  DomainName:
    Type: String
    Description: Hostname to serve the site from, for example mymicrotunnel.example.com

  HostedZoneId:
    Type: String
    Description: Public hosted zone authoritative for DomainName

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        # No object may carry an ACL, and any ACL already present is ignored.
        # Access is decided by the bucket policy and nowhere else.
        BlockPublicAcls: true
        IgnorePublicAcls: true
        # These two are off so that launch/ can be read anonymously. See the
        # bucket policy: it is one prefix, read-only, and everything else in the
        # bucket remains reachable only through CloudFront.
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  # The one-click install template, and nothing else.
  #
  # Its own bucket because CloudFormation will not follow a CloudFront URL —
  # see CloudFormationMayFetchTheLaunchTemplate below — so this name is read
  # by every person who looks at the install link before trusting it. The
  # site bucket's name carries the account number, which is no secret but is
  # nobody's business either, and an S3 bucket cannot be renamed.
  LaunchBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref LaunchBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        # Off for the same reason as the site bucket: the console fetches the
        # template anonymously. Everything in here is a public template.
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  LaunchBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LaunchBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AnyoneMayReadTheLaunchTemplate
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${LaunchBucketName}/*'
          - Sid: NothingUnencryptedInTransit
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${LaunchBucketName}'
              - !Sub 'arn:${AWS::Partition}:s3:::${LaunchBucketName}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyThisDistributionMayRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: CloudFormationMayFetchTheLaunchTemplate
            # CloudFormation's TemplateURL must be an S3 URL — it will not
            # follow a CloudFront one — and the console fetches it as an
            # anonymous caller on the user's behalf. So the one-click install
            # link requires this object to be readable without credentials.
            #
            # Scoped to a single prefix holding public CloudFormation templates,
            # which are meant to be read by anyone considering running them.
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/launch/*'
          - Sid: NothingUnencryptedInTransit
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}'
              - !Sub 'arn:${AWS::Partition}:s3:::${BucketName}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # Five minutes. A page that is edited by hand should show the edit while the
  # person who made it is still looking at the browser.
  SiteCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-page'
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} website'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref SiteCachePolicy
        CustomErrorResponses:
          # A single page: anything else is the page, not a 404 nobody styled.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${DomainName}.'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # The fixed zone every CloudFront distribution lives in. A constant, not
        # this distribution's own.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Value: !Sub 'https://${DomainName}'

  BucketName:
    Value: !Ref SiteBucket

  LaunchBucketName:
    Value: !Ref LaunchBucket

  DistributionId:
    Description: Needed to invalidate the cached page after an edit
    Value: !Ref Distribution

  LaunchStackUrl:
    Description: >-
      One-click link that creates the installer's IAM identity in whichever
      account the person following it is signed into.
    Value: !Sub
      - 'https://console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/create/review?templateURL=https%3A%2F%2F${LaunchBucket}.s3.amazonaws.com%2Fdeploy-role.yaml&stackName=mymicrotunnel-deploy-role'
      - LaunchBucket: !Ref LaunchBucket
