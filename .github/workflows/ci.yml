# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# Runs on macOS because half of what this repository ships is a Swift app and a
# signed installer package, and neither of those can be built anywhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # Reported as a list of files rather than as a diff nobody reads.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build universal
        # The package ships one binary for both architectures. A build that only
        # works on the runner's own architecture is a package that fails to
        # launch on half the Macs it is installed on.
        run: |
          make engine
          lipo -archs build/mymicrotunnel | tee /dev/stderr | grep -q arm64
          lipo -archs build/mymicrotunnel | grep -q x86_64

      - name: Smoke test the built binary
        run: |
          ./build/mymicrotunnel version
          ./build/mymicrotunnel --help

  linux:
    name: Linux
    # The _linux files are invisible to the macOS jobs above: a Linux build
    # that stops compiling, or a tunnel that stops coming up, would otherwise
    # ship without anything noticing. x86_64 here also covers the amd64 half
    # of the bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: Build the Debian bundle
        run: |
          make bundle-debian
          ( cd build && sha256sum -c mymicrotunnel-debian13-*.tar.gz.sha256 )
          file build/mymicrotunnel-debian13-*/bin/mymicrotunnel-linux-amd64 | grep -q x86-64
          file build/mymicrotunnel-debian13-*/bin/mymicrotunnel-linux-arm64 | grep -q aarch64

      - name: Install on Debian 13 and carry traffic through the tunnel
        # A real kernel WireGuard tunnel, from the installed binary to a peer in
        # another network namespace. Privileged because creating interfaces
        # and namespaces needs it; the module is the runner's own kernel's.
        # The systemd supervisor is not exercised: the container has no init.
        run: |
          sudo modprobe wireguard
          docker run --rm --privileged -v "$PWD/build:/dist:ro" debian:trixie bash -euo pipefail -c '
            H=/usr/libexec/mymicrotunnel/mymicrotunnel
            cd /root && tar xzf /dist/mymicrotunnel-debian13-*.tar.gz && cd mymicrotunnel-debian13-*
            ./install.sh
            mymicrotunnel version

            ip netns add gw
            ip link add veth-h type veth peer name veth-g
            ip link set veth-g netns gw
            ip addr add 192.168.77.1/24 dev veth-h && ip link set veth-h up
            ip -n gw addr add 192.168.77.2/24 dev veth-g && ip -n gw link set veth-g up

            umask 077 && mkdir -p /etc/wireguard
            wg genkey > /etc/wireguard/wg0.key && wg genkey > /root/gw.key
            printf "%s\n" "[Interface]" "Address = 10.100.0.2/32" "MTU = 1380" \
              "PostUp = wg set %i private-key /etc/wireguard/wg0.key" "" "[Peer]" \
              "PublicKey = $(wg pubkey < /root/gw.key)" "AllowedIPs = 10.100.0.0/24" \
              "Endpoint = 192.168.77.2:51820" "PersistentKeepalive = 25" > /etc/wireguard/wg0.conf

            ip -n gw link add wg-gw type wireguard
            ip netns exec gw wg set wg-gw private-key /root/gw.key listen-port 51820 \
              peer "$(wg pubkey < /etc/wireguard/wg0.key)" allowed-ips 10.100.0.2/32
            ip -n gw addr add 10.100.0.1/32 dev wg-gw && ip -n gw link set wg-gw up
            ip -n gw route add 10.100.0.2/32 dev wg-gw

            $H tunnel up wg0
            $H tunnel up wg0
            ping -c 3 -W 3 10.100.0.1
            $H tunnel status wg0 | tee /dev/stderr | grep -q "last handshake [0-9]"

            $H tunnel down wg0
            if ip link show wg0 2>/dev/null; then echo "wg0 survived tunnel down" >&2; exit 1; fi
            $H tunnel down wg0

            ./install.sh --uninstall
            test ! -e $H
          '

  app:
    name: Menu bar app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the app bundle
        # This also fetches and builds wireguard-go, which is the one
        # third-party binary the package ships.
        run: make app

      - name: Check both slices are present
        run: |
          binary=menubar/build/MyMicroTunnel.app/Contents/MacOS/MyMicroTunnel
          lipo -archs "$binary" | tee /dev/stderr | grep -q arm64
          lipo -archs "$binary" | grep -q x86_64

      - name: Check the bundle carries its own WireGuard
        # A customer without Homebrew has to be able to install this. If
        # wireguard-go is missing from the bundle, the tunnel cannot come up and
        # the failure only shows on their machine.
        run: |
          engine=menubar/build/MyMicroTunnel.app/Contents/Resources/wireguard-go
          test -x "$engine"
          lipo -archs "$engine" | tee /dev/stderr | grep -q arm64
          lipo -archs "$engine" | grep -q x86_64

      - name: Check the bundle is stamped
        # __VERSION__ surviving into the built bundle means the Makefile's
        # substitution silently did nothing, and every install would report
        # itself as a placeholder.
        run: |
          plist=menubar/build/MyMicroTunnel.app/Contents/Info.plist
          ! grep -q __VERSION__ "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist"

  updates:
    name: Update feed
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch Sparkle
        run: make sparkle

      - name: Check the feed tooling builds and refuses a feed it cannot write
        # No signing key on CI by default, so this cannot cut a release. What it
        # proves is that cmd/appcast compiles, finds Sparkle's tools, and stops
        # with an explanation rather than writing a feed pointing nowhere.
        run: |
          go build ./cmd/appcast
          if go run ./cmd/appcast 2>/dev/null; then
            echo "appcast wrote a feed with no publication URL" >&2
            exit 1
          fi

  template:
    name: CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install --disable-pip-version-check cfn-lint

      - name: Lint the templates
        run: |
          cfn-lint infra/cloudformation-microtunnel.yaml \
                   infra/cloudformation-updates.yaml

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # The installer writes root-owned files and holds AWS credentials. A
        # known-vulnerable dependency in it is worth a failed build.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
